# Сами промокоды лежат в codes.yml (подробности — в README).
# Цвета: &c &f &4 и т.д., HEX — &#RRGGBB. Пустое сообщение ("") = не отправлять.

settings:
  # Регистр для новых промокодов по умолчанию (true — WELCOME и welcome разные)
  case-sensitive-default: false

  # Задержка между попытками /code (секунды). 0 — выключено.
  cooldown-seconds: 3

  # Защита от перебора: после N неверных кодов подряд игрок блокируется
  max-failed-attempts: 5      # 0 — выключить защиту
  lockout-seconds: 120

  # Что делать, если предметы награды не помещаются в инвентарь:
  #   drop — выбросить остаток рядом с игроком
  #   deny — не активировать код, пока не освободится место (использование не списывается)
  inventory-full: drop

  # Часовой пояс для дат: system или, например, Europe/Moscow
  timezone: system
  # Формат дат в сообщениях (хранятся в codes.yml всегда как yyyy-MM-dd HH:mm:ss)
  date-format: "dd.MM.yyyy HH:mm"

  # Как часто сохранять данные об использовании (секунды)
  autosave-seconds: 30

  # Писать активации в консоль и в файл redeems.log
  console-log: true
  log-redeems: true

  # Звуки (ключи звуков Minecraft; пустой sound — без звука)
  sounds:
    success:
      sound: "entity.player.levelup"
      volume: 1.0
      pitch: 1.2
    fail:
      sound: "entity.villager.no"
      volume: 1.0
      pitch: 1.0

  # Уведомление в Discord при активации
  discord-webhook:
    enabled: false
    url: ""
    content: "🎁 **%player%** активировал промокод **%code%** (%uses%/%max%)"

