  cooldown: "&fПодождите &c%time% &fперед следующей попыткой."
  locked: "&cСлишком много неверных попыток! &fПовторите через &c%time%&f."
  invalid: "&cТакого промокода не существует. &fОсталось попыток: &c%left%"
  disabled: "&cЭтот промокод отключён."
